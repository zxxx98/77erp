import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
    root = file('../../mobile')
    reactNativeDir = file('../../mobile/node_modules/react-native')
    codegenDir = file('../../mobile/node_modules/@react-native/codegen')
    cliFile = file('../../mobile/node_modules/react-native/cli.js')
    entryFile = file('../../mobile/index.js')
    autolinkLibrariesWithApp()
}

def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def versionMatch = appVersion =~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
if (!versionMatch.matches()) throw new GradleException('package.json version 必须是 x.y.z 正式版本号')
def parts = versionMatch[0][1..3].collect { it.toBigInteger() }
def appVersionCode = parts[0] * 1000000 + parts[1] * 1000 + parts[2]
if (parts[0] > 2099 || parts[1] > 999 || parts[2] > 999 || appVersionCode < 1) {
    throw new GradleException('版本范围：major ≤ 2099，minor/patch ≤ 999，且不能为 0.0.0')
}

def signingKeys = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def signingReady = signingKeys.every { System.getenv(it) }
if (!signingReady && signingKeys.any { System.getenv(it) }) {
    throw new GradleException('Android 签名环境变量不完整')
}

android {
    namespace 'com.erp77.app'
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk 36

    defaultConfig {
        applicationId 'com.erp77.app'
        minSdk 31
        targetSdk 36
        versionCode appVersionCode.intValueExact()
        versionName appVersion
        // Hermes, React Native and ML Kit are all restricted to ARM64.
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'com.facebook.react:hermes-android'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    // Bundled recognition model: scanning does not require Google Play or a model download.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
