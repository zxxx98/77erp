<div id="stock-approval-mock" class="viz-carousel" aria-label="出入库审核界面" data-previous-label="上一视图" data-next-label="下一视图">
<style>
#stock-approval-mock{--erp-bg:light-dark(#f5f7fa,#171b23);--erp-panel:light-dark(#fff,#222833);--erp-text:light-dark(#182335,#edf1f8);--erp-muted:light-dark(#68758a,#a4b0c1);--erp-line:light-dark(#e3e8ef,#3c4757);--erp-blue:light-dark(#245ee8,#91b2ff);--erp-soft:light-dark(#eaf0ff,#283c60);--erp-warn:light-dark(#805000,#ffce86);--erp-warn-bg:light-dark(#fff5df,#46351d);font-family:system-ui,sans-serif;color:var(--erp-text)}
#stock-approval-mock *{box-sizing:border-box}#stock-approval-mock [hidden]{display:none!important}#stock-approval-mock .stage{min-height:650px}#stock-approval-mock .app{background:var(--erp-bg);border:1px solid var(--erp-line);border-radius:12px;overflow:hidden;font-size:14px}#stock-approval-mock .top{background:var(--erp-panel);padding:18px 22px;border-bottom:1px solid var(--erp-line);display:flex;gap:24px;align-items:center;flex-wrap:wrap}#stock-approval-mock .brand{font-size:19px;font-weight:600}#stock-approval-mock .muted{color:var(--erp-muted)}#stock-approval-mock .shell{display:grid;grid-template-columns:130px minmax(0,1fr)}#stock-approval-mock .side{padding:20px 12px;background:var(--erp-panel);border-right:1px solid var(--erp-line)}#stock-approval-mock .side div{padding:11px;margin-bottom:5px}#stock-approval-mock .selected{background:var(--erp-soft);color:var(--erp-blue);border-radius:7px}#stock-approval-mock main{padding:22px;min-width:0}#stock-approval-mock .heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}#stock-approval-mock h2{font-size:20px;margin:0}#stock-approval-mock h3{font-size:16px;margin:0}#stock-approval-mock button{font:inherit;color:var(--erp-text);background:var(--erp-panel);border:1px solid var(--erp-line);border-radius:7px;padding:9px 13px;min-height:40px}#stock-approval-mock .primary{background:var(--erp-blue);color:light-dark(#fff,#132442);border-color:var(--erp-blue)}#stock-approval-mock .tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}#stock-approval-mock .tabs button[aria-pressed=true]{color:var(--erp-blue);background:var(--erp-soft);border-color:var(--erp-blue)}#stock-approval-mock .filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}#stock-approval-mock input,#stock-approval-mock textarea{font:inherit;color:var(--erp-text);background:var(--erp-panel);border:1px solid var(--erp-line);border-radius:6px;padding:10px;max-width:100%}#stock-approval-mock .list{background:var(--erp-panel);border:1px solid var(--erp-line);border-radius:9px}#stock-approval-mock .row{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--erp-line)}#stock-approval-mock .row:last-child{border-bottom:0}#stock-approval-mock .row p{margin:7px 0 0;line-height:1.6}#stock-approval-mock .badge{display:inline-block;padding:3px 8px;border-radius:5px;color:var(--erp-warn);background:var(--erp-warn-bg);font-size:12px;margin-left:6px}#stock-approval-mock .foot{padding-top:14px;color:var(--erp-muted);font-size:12px}#stock-approval-mock .detail{background:var(--erp-panel);border:1px solid var(--erp-line);border-radius:9px;padding:19px;margin-top:14px}#stock-approval-mock .detail p{line-height:1.8;margin:12px 0}#stock-approval-mock .notice{background:var(--erp-warn-bg);color:var(--erp-warn);padding:11px;border-radius:6px;margin:14px 0}#stock-approval-mock .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}#stock-approval-mock .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}#stock-approval-mock .phone{max-width:390px;margin:0 auto}#stock-approval-mock .phone main{padding:16px}#stock-approval-mock .phone .top{padding:15px}#stock-approval-mock .phone .heading{margin-bottom:14px}#stock-approval-mock .phone .facts{grid-template-columns:1fr}#stock-approval-mock .phone .actions button{flex:1;min-height:46px}#stock-approval-mock .phone .tabs button{padding:8px 10px}#stock-approval-mock .mobilebar{padding:13px;display:flex;justify-content:space-around;background:var(--erp-panel);border-top:1px solid var(--erp-line)}#stock-approval-mock .result{padding:14px 0;color:var(--erp-blue);line-height:1.7}#stock-approval-mock .back{margin-bottom:12px}#stock-approval-mock .form{display:grid;gap:12px}#stock-approval-mock .form label{display:grid;gap:7px}@media(max-width:600px){#stock-approval-mock .shell{grid-template-columns:1fr}#stock-approval-mock .side{display:none}#stock-approval-mock main{padding:14px}#stock-approval-mock .top{padding:14px}#stock-approval-mock .facts{grid-template-columns:1fr}#stock-approval-mock .stage{min-height:760px}#stock-approval-mock .row{padding:12px}#stock-approval-mock input{width:100%}#stock-approval-mock button{min-height:44px}}
</style>
<section data-variant="桌面工作台" class="stage" aria-label="桌面出入库审核">
<div class="app"><header class="top"><span class="brand">77ERP</span><span>仓库模式</span><span class="muted">当前仓库 · 主仓库</span></header><div class="shell"><aside class="side"><div>仪表盘</div><div>物料</div><div>库存</div><div class="selected">出入库</div><div>业务资料</div></aside><main data-screen="desktop"></main></div></div>
</section>
<section data-variant="手机与 PWA" class="stage viz-dotted-background" aria-label="手机出入库审核" hidden>
<div class="app phone"><header class="top"><span class="brand">77ERP</span><span class="muted">主仓库</span></header><main data-screen="mobile"></main><nav class="mobilebar"><span>首页</span><span>物料</span><span style="color:var(--erp-blue)">出入库</span><span>更多</span></nav></div>
</section>
<script>
(()=>{
const root=document.getElementById('stock-approval-mock');
const seeds=[{id:'CK20261104000018',name:'华兴制造',label:'普通出库',user:'张明',time:'14:32',material:'铝型材 A01',qty:10,stock:120},{id:'RK20261104000012',name:'恒达供应商',label:'普通入库',user:'李芳',time:'14:18',material:'铝型材 A01',qty:40,stock:120}];
const saved=window.openai?.widgetState?.privateContent||{};
const models={desktop:{tab:'待审核',view:'list',...saved.desktop},mobile:{tab:'待审核',view:'list',...saved.mobile}};
function persist(){window.openai?.setWidgetState({modelContent:{proposal:'沿用出入库页面，分类待审核，详情显式审核；手机全屏详情'},privateContent:models})?.catch(()=>{});}
function draw(screen){const host=root.querySelector('[data-screen='+screen+']');const state=models[screen];const index=state.item||0;const item=seeds[index];
if(state.view==='form'){host.innerHTML='<button class="back cursor-interaction" data-action="back">← 返回出入库</button><h2>新建出库单</h2><div class="form" style="margin-top:16px"><label>往来单位<input value="华兴制造" readonly></label><label>物料<input value="铝型材 A01 · 10 件" readonly></label><label>备注<input placeholder="填写备注"></label></div><div class="notice">提交后等待审核，库存暂不变动</div><div class="actions"><button class="primary cursor-interaction" data-action="submit">提交审核</button></div>';}
else if(state.view==='detail'||state.view==='confirm'||state.view==='reject'){host.innerHTML='<button class="back cursor-interaction" data-action="back">← 返回列表</button><h2>'+item.label+'审核</h2><p class="muted">'+item.id+'</p><div class="facts"><span>往来单位：'+item.name+'</span><span>提交人：'+item.user+'</span><span>仓库：主仓库</span><span>提交时间：今天 '+item.time+'</span></div><div class="list"><div class="row"><div><strong>'+item.material+'</strong><p class="muted">数量 '+item.qty+' 件 · 单价 ¥20.00</p></div><strong>¥'+(item.qty*20).toFixed(2)+'</strong></div></div><div class="notice">待审核 · 库存尚未变动</div><p>当前库存 '+item.stock+' 件 → 审核后 '+(index===0?item.stock-item.qty:item.stock+item.qty)+' 件</p>'+(state.view==='confirm'?'<div class="detail"><h3>确认审核通过？</h3><p>将'+(index===0?'出库':'入库')+' '+item.qty+' 件，并正式记账。</p><div class="actions"><button class="cursor-interaction" data-action="detail">返回核对</button><button class="primary cursor-interaction" data-action="approve">确认通过</button></div></div>':state.view==='reject'?'<div class="detail"><label>驳回原因<textarea aria-label="驳回原因" placeholder="请填写原因" rows="3" style="width:100%;margin-top:8px"></textarea></label><p role="alert" data-error></p><div class="actions"><button class="cursor-interaction" data-action="detail">取消</button><button class="primary cursor-interaction" data-action="rejected">确认驳回</button></div></div>':'<div class="actions"><button class="cursor-interaction" data-action="reject">驳回</button><button class="primary cursor-interaction" data-action="confirm">审核通过</button></div>');}
else{const filtered=seeds.filter((x,i)=>!state.done?.includes(i));host.innerHTML='<div class="heading"><h2>出入库</h2><button class="primary cursor-interaction" data-action="form">＋ 新建出库</button></div><div class="tabs"><button class="cursor-interaction" data-action="tab" data-tab="单据记录" aria-pressed="'+(state.tab==='单据记录')+'">单据记录</button><button class="cursor-interaction" data-action="tab" data-tab="待审核" aria-pressed="'+(state.tab==='待审核')+'">待审核 '+filtered.length+'</button></div>'+(state.notice?'<div class="result" aria-live="polite">'+state.notice+'</div>':'')+(state.tab==='待审核'?'<div class="tabs"><button aria-pressed="true">普通出入库 '+filtered.length+'</button><button disabled>成品入库 0</button><button disabled>退料入库 0</button><button disabled>领料／补料 0</button></div><div class="list">'+(filtered.length?filtered.map(x=>{const i=seeds.indexOf(x);return '<div class="row"><div><strong>'+x.label+'</strong><span class="badge">待审核</span><p>'+x.id+'</p><p>'+x.name+' · '+x.qty+' 件</p><p class="muted">'+x.user+' · 今天 '+x.time+'</p></div><button class="cursor-interaction" data-action="open" data-item="'+i+'">审核</button></div>';}).join(''):'<div class="row">暂无待审核单据</div>')+'</div><div class="foot">审核通过后才变动库存与账务</div>':'<div class="list"><div class="row"><div><strong>普通出库 · 华兴制造</strong><p>CK20261104000018</p><p class="muted">'+(state.done?.includes(0)?'已处理 · 查看审核结果':'待审核 · 库存尚未变动')+'</p></div></div></div>');}
host.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{const a=button.dataset.action;if(a==='open'){state.item=+button.dataset.item;state.view='detail';}else if(a==='back'){state.view='list';}else if(a==='tab'){state.tab=button.dataset.tab;}else if(a==='approve'||a==='rejected'){if(a==='rejected'&&!host.querySelector('textarea').value.trim()){host.querySelector('[data-error]').textContent='请填写驳回原因';return;}state.done=[...new Set([...(state.done||[]),state.item||0])];state.notice=a==='approve'?'审核通过，库存及账务已更新（示意）':'已驳回，库存未变动（示意）';state.view='list';}else if(a==='submit'){state.view='list';state.tab='单据记录';state.notice='已提交审核，库存尚未变动（示意）';}else{state.view=a;}draw(screen);persist();});}
Object.keys(models).forEach(draw);
window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;if(data)Object.keys(models).forEach(k=>{if(data[k])Object.assign(models[k],data[k]);draw(k);});});
})();
</script>
</div>
