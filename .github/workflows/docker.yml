name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test server
        run: |
          npm ci
          npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Send WeChat Work notification
        if: github.event_name != 'pull_request' && success() && env.WECHAT_WEBHOOK_URL != ''
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REF_NAME="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          IMAGE="${{ steps.image.outputs.name }}:latest"

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg ref "$REF_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg msg "$COMMIT_MSG" \
            --arg image "$IMAGE" \
            '{
              msgtype: "markdown",
              markdown: {
                content: "### 🚀 77ERP Docker 镜像构建完成\n> **仓库**: \($repo)\n> **分支/标签**: <font color=\"info\">\($ref)</font> (\($sha))\n> **最新提交**: \($msg)\n> **镜像地址**: `\($image)`\n> **状态**: <font color=\"comment\">多架构(amd64/arm64)发布成功，可执行更新拉取</font>"
              }
            }')

          curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WECHAT_WEBHOOK_URL"

