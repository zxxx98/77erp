name: Android ARM64 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要验证的版本号，须与所选分支的 package.json 一致，例如 1.0.0（仅构建，不发布）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
        run: node scripts/android-version.mjs "$RELEASE_TAG"
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing) + '. See docs/android.md.')
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / '77erp-release.jks'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          PY
      - name: Check web application
        run: |
          npm ci
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed ARM64 APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/77erp-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify and package artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 scripts/check-android-artifacts.py \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_HOME/build-tools/36.0.0/aapt" "$VERSION" "$VERSION_CODE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/77ERP-$VERSION-arm64.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/77ERP-$VERSION-arm64.aab"
          cd artifacts
          sha256sum *.apk *.aab > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            android/app/build/reports/
            test-results/
          if-no-files-found: ignore
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/77erp-release.jks"

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag \
              --title "77 ERP $VERSION · Android ARM64" --generate-notes
          fi
