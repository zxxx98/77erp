  const states = new Map();

  const persist = () => { const snapshots={};for(const [key,s] of states) snapshots[key]={page:s.page,filter:s.filter};window.openai?.setWidgetState?.({modelContent:{offlinePreview:design.offline},privateContent:{offline:design.offline,screens:snapshots}})?.catch(()=>{}); };
  const alertRows = () => products.slice(0,2).map(p=>`<button type="button" class="erp77-row cursor-interaction" data-action="inventory"><span class="erp77-thumb">${icon(p.icon)}</span><span class="erp77-row-body"><span class="erp77-row-name">${p.name}</span><span class="erp77-row-note" style="display:block">安全库存 ${p.threshold} ${p.unit}</span></span><span class="erp77-row-end"><span class="erp77-amount">${p.stock} <span class="erp77-muted">${p.unit}</span></span><span style="display:block"><span class="erp77-badge">${p.stock===0?'缺货':'库存偏低'}</span></span></span></button>`).join('');
  const docsRows = () => `<button type="button" class="erp77-row cursor-interaction" data-action="document"><span class="erp77-thumb">${icon('arrow-up-from-line')}</span><span class="erp77-row-body"><span class="erp77-row-name">销售出库 · 恒远商贸</span><span class="erp77-row-note" style="display:block">14:32 · 2 种商品</span></span><span class="erp77-row-end"><span class="erp77-amount">¥ 620.00</span><span class="erp77-row-note" style="display:block">已完成</span></span></button><button type="button" class="erp77-row cursor-interaction" data-action="document"><span class="erp77-thumb">${icon('arrow-down-to-line')}</span><span class="erp77-row-body"><span class="erp77-row-name">采购入库 · 鑫达供应</span><span class="erp77-row-note" style="display:block">11:06 · 3 种商品</span></span><span class="erp77-row-end"><span class="erp77-amount">¥ 1,280.00</span><span class="erp77-row-note" style="display:block">已完成</span></span></button>`;
  const nativeProductRow = p => `<button type="button" class="erp77-native-row cursor-interaction" data-product="${p.code}"><span class="erp77-thumb">${icon('box')}</span><span class="erp77-row-body"><span class="erp77-native-name">${p.name}${icon('chevron-right')}</span><span class="erp77-row-note" style="display:block">${p.code}</span><span class="erp77-row-note" style="display:block">${p.spec}</span><span class="erp77-native-state"><span class="erp77-muted">日用百货</span><span class="erp77-badge ${p.stock===0?'erp77-badge-red':p.stock>p.threshold?'erp77-badge-green':''}">${p.stock===0?'缺货':p.stock<=p.threshold?'库存偏低':'库存充足'}</span></span><span class="erp77-native-facts"><span>库存 ${p.stock} ${p.unit}</span><span>售价 ¥${money(p.price)}</span></span></span></button>`;
  const secondary = (action,label,i='') => `<button type="button" class="erp77-secondary cursor-interaction" data-action="${action}">${i?icon(i):''}${label}</button>`;
  function home() {
    const stats=[['商品种类','4','box'],['库存成本',`¥${money(products.reduce((sum,p)=>sum+p.stock*p.cost,0))}`,'warehouse'],['今日采购','¥1,280.00','arrow-down-to-line'],['今日销售','¥3,860.00','arrow-up-from-line']];
    return `<div class="erp77-page-title"><div><h2>工作台</h2><div class="erp77-row-note">七七商贸 · ${states.get('business')?.warehouse||'主仓库'}</div></div></div><div class="erp77-summary">${stats.map(([label,value,i])=>`<div class="erp77-card erp77-stat"><div class="erp77-card-heading"><span>${label}</span>${icon(i)}</div><div class="erp77-money">${value}</div></div>`).join('')}</div><section class="erp77-card erp77-native-section"><h3>快速操作</h3><button type="button" class="erp77-primary cursor-interaction" data-action="scanner">${icon('scan-line')}扫描商品条码</button><div class="erp77-native-columns">${secondary('purchase','采购入库','arrow-down-to-line')}${secondary('sale','销售出库','arrow-up-from-line')}</div></section><section class="erp77-card erp77-native-section"><div class="erp77-section-heading"><h3>库存预警</h3><span class="erp77-warning">2 件商品</span></div>${products.slice(0,2).map(nativeProductRow).join('')}</section><section class="erp77-card erp77-native-section"><h3>最近单据</h3>${docsRows()}${secondary('orders','查看全部单据')}</section>`;
  }
  function productList(s,inventory) {
    let list = products.filter(p=>(s.filter==='all'||(s.filter==='low'?p.stock<=p.threshold:p.stock===0))&&(!s.search||`${p.name}${p.code}${p.spec}`.toLowerCase().includes(s.search.toLowerCase())));
    const filters=inventory?[['all','全部库存'],['low','库存预警'],['empty','缺货']]:[['all','全部状态'],['active','已上架'],['inactive','已下架']];
    if(!inventory){list=products.filter(p=>s.filter!=='inactive'&&(!s.search||`${p.name}${p.code}${p.spec}`.includes(s.search)));}
    return `<div class="erp77-page-title"><div><h2>${inventory?'库存管理':'商品管理'}</h2><div class="erp77-row-note">共 4 种商品 · 筛选 ${list.length} 种</div></div>${inventory?'':`<button type="button" class="erp77-native-icon cursor-interaction" data-action="newproduct" aria-label="新增商品">${icon('plus')}</button>`}</div>${inventory?'':secondary('categories','管理分类')}<div class="erp77-search">${icon('search')}<input aria-label="搜索商品名称、条码或分类" placeholder="搜索商品名称、条码或分类" value="${safe(s.search)}" data-search></div><div class="erp77-filters">${filters.map(([f,l])=>`<button type="button" class="erp77-filter cursor-interaction" data-filter="${f}" aria-pressed="${s.filter===f}">${l}</button>`).join('')}</div>${inventory?'':'<div class="erp77-filters"><span class="erp77-filter" aria-pressed="true">全部分类</span></div>'}<div class="erp77-native-product-list">${list.length?list.map(nativeProductRow).join(''):'<div class="erp77-empty">未找到商品</div>'}</div>`;
  }
  function form(s) {
    const sale = s.type==='sale';
    return `${secondary('templates','选择单据模板')}<label class="erp77-form-label">${sale?'客户':'供应商'}</label><input class="erp77-input" aria-label="${sale?'客户':'供应商'}" data-partner value="${safe(s.partner)}" style="margin-bottom:16px"><button type="button" class="erp77-primary cursor-interaction" data-action="scanner" style="margin-bottom:16px">${icon('camera')}扫码添加商品</button>${secondary('add','搜索要添加的商品或条码','search')}${secondary('inactive','包含下架商品（清库存等）')}${[products[0],products[2]].map((p,i)=>`<div class="erp77-card erp77-native-section"><div class="erp77-native-name"><span>${p.name}</span><button type="button" class="erp77-native-icon cursor-interaction" data-action="remove-preview" aria-label="移除${p.name}">${icon('trash-2')}</button></div><div class="erp77-row-note">可用库存 ${p.stock} ${p.unit}</div><div class="erp77-form-fields"><label><span class="erp77-form-label">数量</span><input class="erp77-input" inputmode="decimal" aria-label="${p.name}数量" data-quantity="${i}" value="${s.quantities[i]}"></label><label><span class="erp77-form-label">单价</span><input class="erp77-input" inputmode="decimal" aria-label="${p.name}单价" data-price="${i}" value="${s.prices[i]}"></label></div><div class="erp77-quantity-actions"><span class="erp77-quantity-buttons"><button type="button" class="erp77-native-icon cursor-interaction" data-step="-1" data-line="${i}" aria-label="减少${p.name}数量">${icon('minus')}</button><button type="button" class="erp77-native-icon cursor-interaction" data-step="1" data-line="${i}" aria-label="增加${p.name}数量">${icon('plus')}</button></span><strong data-line-total="${i}">¥${money(Number(s.quantities[i])*Number(s.prices[i]))}</strong></div></div>`).join('')}<label class="erp77-form-label">备注（选填）</label><textarea class="erp77-input" aria-label="备注（选填）" rows="2"></textarea><div class="erp77-note" data-form-error role="alert"></div>`;
  }
  const total = s => s.quantities.reduce((sum,q,i)=>sum+Number(q)*Number(s.prices[i]),0);
  function content(s,layout) {
    if(s.page==='home') return home(layout);
    if(s.page==='products'||s.page==='inventory') return productList(s,s.page==='inventory');
    if(s.page==='form') return form(s);
    if(s.page==='orders') return `<div class="erp77-page-title"><h2>操作记录</h2></div><div class="erp77-native-columns" style="margin-bottom:16px">${secondary('purchase','新建入库','arrow-down-to-line')}<button type="button" class="erp77-primary cursor-interaction" data-action="sale">${icon('arrow-up-from-line')}新建出库</button></div><div class="erp77-search">${icon('search')}<input aria-label="搜索单据" placeholder="搜索单据号、往来单位或商品"></div><div class="erp77-filters"><span class="erp77-filter" aria-pressed="true">全部单据</span><span class="erp77-filter">采购入库</span><span class="erp77-filter">销售出库</span></div><div class="erp77-filters"><span class="erp77-filter" aria-pressed="true">全部时间</span><span class="erp77-filter">近 7 天</span><span class="erp77-filter">近 30 天</span></div><div class="erp77-muted" style="margin-bottom:16px">示例 · 2 张单据 · 合计 ¥1,900.00</div><div class="erp77-card erp77-documents">${docsRows()}</div>`;
    if(s.page==='more') return `<div class="erp77-page-title"><h2>工作空间</h2></div><div class="erp77-native-more"><div class="erp77-card"><div class="erp77-brand">${icon('shield-check')}<div><h3>管理员</h3><div class="erp77-muted">管理员账号</div></div></div></div><div class="erp77-card"><h3>七七商贸</h3><div class="erp77-muted">${s.warehouse}</div>${secondary('settings','商户与仓库设置','settings')}</div>${secondary('password','修改密码')}${secondary('business','业务管理')}<div class="erp77-card"><label class="erp77-form-label">服务器地址</label><div class="erp77-muted">当前站点 · 同源连接</div></div>${secondary('logout','退出登录','log-out')}<div class="erp77-card"><h3>网页版应用</h3>${secondary('install','安装到桌面','download')}${secondary('update','检查更新','refresh-cw')}${secondary('drafts','本地草稿','file-pen-line')}</div><div class="erp77-muted" style="text-align:center">77 ERP · 数据保存在服务器</div></div>`;
    if(s.page==='product') { const p=products.find(p=>p.code===s.product)||products[0];return `<div class="erp77-page-title"><h2>${p.name}</h2></div><div class="erp77-card"><div class="erp77-row"><span class="erp77-thumb">${icon(p.icon)}</span><span><div class="erp77-row-name">${p.spec}</div><div class="erp77-row-note">${p.code}</div></span></div>${[['当前仓库',s.warehouse],['现有库存',`${p.stock} ${p.unit}`],['安全库存',`${p.threshold} ${p.unit}`],['销售参考价',`¥ ${money(p.price)}`]].map(([l,v])=>`<div class="erp77-detail-labels"><span class="erp77-muted">${l}</span><span>${v}</span></div>`).join('')}</div><button type="button" class="erp77-primary cursor-interaction" data-action="purchase" style="margin-top:18px">采购补货</button>`; }
    if(s.page==='review') return form(s);
    if(s.page==='success') return `<div class="erp77-success">${icon('circle-check')}<h3>单据完成状态</h3><div class="erp77-muted">设计预览 · 未生成实际单据</div></div><div class="erp77-card">${[['仓库',s.warehouse],['往来单位',s.partner],['合计',`¥ ${money(total(s))}`]].map(([l,v])=>`<div class="erp77-detail-labels"><span class="erp77-muted">${l}</span><span>${safe(v)}</span></div>`).join('')}</div><button type="button" class="erp77-primary cursor-interaction" data-action="home" style="margin-top:18px">返回工作台</button>`;
    if(s.page==='scanner') return `<div class="erp77-page-title"><h2>扫码查询</h2></div><div class="erp77-card"><div class="erp77-success">${icon('camera')}<h3>相机取景区域</h3><div class="erp77-muted">设计预览 · 相机未开启</div></div></div><div class="erp77-note">将商品条码或二维码置于取景框内</div><button type="button" class="erp77-primary cursor-interaction" data-action="products" style="margin-top:18px">改用商品搜索</button>`;
    if(s.page==='document') return `<div class="erp77-page-title"><h2>销售出库详情</h2><span class="erp77-badge">已完成</span></div><div class="erp77-card">${[['单据号','CK20261014000006'],['仓库',s.warehouse],['客户','恒远商贸'],['开单人','管理员'],['时间','10月14日 14:32'],['成交金额','¥ 620.00']].map(([l,v])=>`<div class="erp77-detail-labels"><span class="erp77-muted">${l}</span><span>${v}</span></div>`).join('')}</div><div class="erp77-note">历史单据保留成交价格与商品名称快照。</div>`;
    return `<div class="erp77-page-title"><h2>${safe(s.detailTitle||'业务功能')}</h2></div><div class="erp77-card"><div class="erp77-empty">此设计稿展示入口位置</div></div><button type="button" class="erp77-primary cursor-interaction" data-action="home" style="margin-top:18px">返回工作台</button>`;
  }
  function render(phone,s) {
    const editing=['form','review'].includes(s.page), detail=!tabs.some(t=>t[0]===s.page);
    const title=editing?(s.type==='sale'?'销售出库':'采购入库'):({product:'商品详情',scanner:'扫码工作台',document:'单据详情',success:'单据已保存'})[s.page]||s.detailTitle||'业务功能';
    const header=detail?`<button type="button" class="erp77-native-icon cursor-interaction" aria-label="返回" data-action="back">${icon('arrow-left')}</button><div class="erp77-modal-title">${safe(title)}</div><button type="button" class="erp77-native-icon cursor-interaction" aria-label="关闭" data-action="back">${icon('x')}</button>`:`<div class="erp77-native-wordmark">77 <span>ERP</span></div><button type="button" class="erp77-warehouse cursor-interaction" data-action="warehouse" aria-label="切换仓库">${s.warehouse} ▾</button><button type="button" class="erp77-native-icon cursor-interaction" data-action="scanner" aria-label="打开扫码工作台">${icon('scan-line')}</button>`;
    const confirmation=s.page==='review'?`<div class="erp77-confirm-backdrop"><div class="erp77-confirm-dialog" role="dialog" aria-modal="true" aria-label="确认${s.type==='sale'?'销售出库':'采购入库'}"><h3>确认${s.type==='sale'?'销售出库':'采购入库'}？</h3><p>2 种商品，合计 ¥${money(total(s))}。确认后立即更新库存。</p><p class="erp77-muted">${s.warehouse} · ${safe(s.partner)}</p>${secondary('back','继续编辑')}<button type="button" class="erp77-primary cursor-interaction" data-action="confirm" ${design.offline?'disabled':''}>${design.offline?'联网后确认':'确认提交'}</button><div class="erp77-note">设计预览 · 不调整实际库存</div></div></div>`:'';
    phone.innerHTML=`<div class="erp77-status"><span>9:41</span><span class="erp77-status-icons">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><header class="erp77-header" ${s.page==='review'?'inert':''}>${header}</header>${design.offline?`<div class="erp77-network" role="status">${icon('wifi-off')}离线预览 · 可编辑草稿，联网后确认</div>`:''}<main class="erp77-main" aria-live="polite" ${s.page==='review'?'inert':''}>${content(s,phone.dataset.layout)}</main>${editing?`<div class="erp77-order-footer" ${s.page==='review'?'inert':''}><div class="erp77-total"><span class="erp77-muted">2 种商品</span><strong data-total>¥${money(total(s))}</strong></div><button type="button" class="erp77-primary cursor-interaction" data-action="review">${icon('check')}${s.type==='sale'?'确认出库':'确认入库'}</button></div>`:detail?'':`<nav class="erp77-bottom" aria-label="主导航">${tabs.map(([id,label,i])=>`<button type="button" class="cursor-interaction" data-action="${id}" ${s.page===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('')}</nav>`}<div class="erp77-footer"><div class="erp77-homebar"></div></div>${confirmation}`;
    if(globalThis.lucide) lucide.createIcons({attrs:{width:18,height:18}});
    if(s.page==='review')phone.querySelector('[role="dialog"] button').focus();
  }
  function renderAll(){for(const phone of root.querySelectorAll('.erp77-phone'))render(phone,states.get(phone.dataset.layout));}
  root.querySelectorAll('.erp77-phone').forEach(phone=>{
    const key=phone.dataset.layout, prior=saved.screens?.[key];
    const s={page:tabs.some(t=>t[0]===prior?.page)?prior.page:'home',filter:['all','low','empty','active','inactive'].includes(prior?.filter)?prior.filter:'all',search:'',warehouse:'主仓库',type:'sale',partner:'恒远商贸',quantities:[2,10],prices:[59,18],product:products[0].code,previous:'home'};
    states.set(key,s);render(phone,s);
    phone.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.dataset.step){const i=Number(button.dataset.line);s.quantities[i]=Math.max(0.000001,Math.round((Number(s.quantities[i])+Number(button.dataset.step))*1000000)/1000000);render(phone,s);return;}
      if(button.dataset.filter){s.filter=button.dataset.filter;render(phone,s);persist();return;}
      if(button.dataset.product){s.previous=s.page;s.product=button.dataset.product;s.page='product';render(phone,s);persist();return;}
      const a=button.dataset.action;if(!a)return;
      if(a==='offline'){design.offline=!design.offline;renderAll();persist();return;}
      if(a==='warehouse'){s.warehouse=s.warehouse==='主仓库'?'门店仓':'主仓库';render(phone,s);persist();return;}
      if(a==='sale'||a==='purchase'){s.previous=s.page;s.page='form';s.type=a;s.partner=a==='sale'?'恒远商贸':'鑫达供应';s.prices=a==='sale'?[59,18]:[32,8];}
      else if(a==='review'){
        const error=!s.partner.trim()?'请填写往来单位。':s.quantities.some(q=>!/^\d+(\.\d{1,6})?$/.test(String(q))||Number(q)<=0)?'数量必须为正数，最多 6 位小数。':s.prices.some(p=>!/^\d+(\.\d{1,2})?$/.test(String(p)))?'单价最多两位小数。':s.type==='sale'&&(Number(s.quantities[0])>8||Number(s.quantities[1])>128)?'出库数量超过当前库存，请修改。':'';
        if(error){phone.querySelector('[data-form-error]').textContent=error;return;}s.page='review';
      } else if(a==='confirm'){if(design.offline)return;s.page='success';}
      else if(a==='back')s.page=s.page==='review'?'form':s.previous;
      else if(a==='inventory'){s.page='inventory';s.filter='all';s.search='';}
      else if(tabs.some(t=>t[0]===a)){s.page=a;s.previous=a;if(a==='products'){s.filter='all';s.search='';}}
      else if(a==='scanner'||a==='document'){s.previous=s.page;s.page=a;}
      else if(a==='add'){s.page='detail';s.previous='form';s.detailTitle='添加商品 · 搜索或扫码';}
      else {s.previous=s.page;s.page='detail';s.detailTitle=({stocktake:'库存盘点',newproduct:'新增商品',categories:'管理分类',business:'业务管理',password:'修改密码',logout:'退出登录',update:'检查更新',drafts:'本地草稿',contacts:'往来单位',templates:'单据模板',finance:'财务报表',settings:'商户与仓库设置',install:'安装到桌面'})[a]||'业务功能';}
      render(phone,s);persist();
    });
    phone.addEventListener('input',event=>{
      const el=event.target;
      if(el.hasAttribute('data-search')){const start=el.selectionStart,end=el.selectionEnd;s.search=el.value;render(phone,s);const next=phone.querySelector('[data-search]');next.focus();next.setSelectionRange(start,end);}
      if(el.hasAttribute('data-partner'))s.partner=el.value;
      if(el.hasAttribute('data-quantity'))s.quantities[Number(el.dataset.quantity)]=el.value;
      if(el.hasAttribute('data-price'))s.prices[Number(el.dataset.price)]=el.value;
      const sum=phone.querySelector('[data-total]');if(sum)sum.textContent=`¥ ${money(total(s))}`;
      phone.querySelectorAll('[data-line-total]').forEach(line=>{const i=Number(line.dataset.lineTotal);line.textContent=`¥ ${money(Number(s.quantities[i])*Number(s.prices[i]))}`;});
    });
  });
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{renderAll();persist();}});tweak.addToggle(design,'offline',{label:'离线状态预览'});}
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent;if(!incoming)return;if(typeof incoming.offline==='boolean')design.offline=incoming.offline;for(const [key,s] of states){const next=incoming.screens?.[key];if(tabs.some(t=>t[0]===next?.page))s.page=next.page;if(['all','low','empty','active','inactive'].includes(next?.filter))s.filter=next.filter;}renderAll();});
})();
</script>
