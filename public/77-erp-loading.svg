<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>77 ERP loading</title>
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- base ring -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="#dbeafe" stroke-width="7"/>

  <!-- rotating arc -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 48 48" to="360 48 48" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="48" cy="48" r="42" fill="none" stroke="url(#arc)"
      stroke-width="7" stroke-linecap="round" stroke-dasharray="79 185"/>
  </g>

  <!-- 77 badge with soft pulse -->
  <g>
    <animate attributeName="opacity" values="1;.72;1" dur="1.6s" repeatCount="indefinite"/>
    <rect x="26" y="26" width="44" height="44" rx="12" fill="#2563eb"/>
    <path d="M35.9 39.2h11L39.2 56.8m10-17.6h11l-7.7 17.6" fill="none"
      stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
